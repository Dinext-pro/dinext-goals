# Shared release policy is pinned; deploy is outside this workflow.
name: Release
'on':
  workflow_dispatch:
    inputs:
      version:
        description: Version tag to release
        required: true
        type: string
      commit:
        description: Full 40-character stable branch SHA
        required: true
        type: string
      dry-run:
        description: Validate only; create no tag or GitHub Release
        type: boolean
        default: true
permissions:
  contents: read
  actions: read
concurrency:
  group: dinext-release-${{ github.repository }}
  cancel-in-progress: false
jobs:
  preflight:
    name: Release preflight
    uses: Dinext-pro/dinext-common/.github/workflows/dinext-release-preflight.yml@a5a8bfb29b966d623909385bcd91bdea8132f383
    with:
      support-ref: a5a8bfb29b966d623909385bcd91bdea8132f383
      version: ${{ inputs.version }}
      commit: ${{ inputs.commit }}
  validation:
    name: Release validation
    needs: preflight
    uses: ./.github/workflows/dinext-validation.yml
  publish:
    name: Publish verified release
    needs:
    - preflight
    - validation
    uses: Dinext-pro/dinext-common/.github/workflows/dinext-release-publish.yml@a5a8bfb29b966d623909385bcd91bdea8132f383
    secrets:
      DINEXT_RELEASE_APP_PRIVATE_KEY: ${{ secrets.DINEXT_RELEASE_APP_PRIVATE_KEY }}
    with:
      support-ref: a5a8bfb29b966d623909385bcd91bdea8132f383
      version: ${{ inputs.version }}
      commit: ${{ inputs.commit }}
      dry-run: ${{ inputs.dry-run }}
      artifact-id: ${{ needs.preflight.outputs.artifact-id }}
      preparation-sha256: ${{ needs.preflight.outputs.sha256 }}
