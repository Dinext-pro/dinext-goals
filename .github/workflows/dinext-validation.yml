name: Dinext validation
'on':
  workflow_call: {}
  push:
    tags: ['v*', 'dinext/**']
    branches:
    - main
    - develop
    - main/**
    - release/**
  pull_request: {}
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: dinext-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  release-context:
    name: Tag source context
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Verify native tag context
        run: |
          test "$GITHUB_REF_TYPE" = tag
          test "$GITHUB_REF" = "refs/tags/$GITHUB_REF_NAME"
  validation:
    name: Validation
    uses: Dinext-pro/dinext-common/.github/workflows/dinext-reusable.yml@main
    with:
      support_ref: main
      mode: frappe-app
      frontend_tests: false
